<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KUSA Awards 2026 - User Login</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<h2>KUSA Awards 2026 - Student Login</h2>

<div class="card" id="emailBox">
  <h3>Enter KU Email</h3>

  <input type="email" id="email" placeholder="yourname@students.ku.ac.ke">
  <button onclick="sendOtp()">Send OTP</button>

  <p id="msg1"></p>
</div>

<div class="card" id="otpBox" style="display:none;">
  <h3>Enter OTP</h3>

  <input type="text" id="otp" placeholder="6-digit code">
  <button onclick="verifyOtp()">Verify</button>

  <p id="msg2"></p>
</div>

<script>
const API = "http://localhost:5000/api";

/* SEND OTP */
async function sendOtp() {
  const email = document.getElementById("email").value.trim();

  const res = await fetch(`${API}/auth/send-otp`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email })
  });

  const data = await res.json();

  document.getElementById("msg1").innerText = data.message || data.error;

  if (data.message) {
    document.getElementById("emailBox").style.display = "none";
    document.getElementById("otpBox").style.display = "block";
  }
}

/* VERIFY OTP */
async function verifyOtp() {
  const email = document.getElementById("email").value.trim();
  const code = document.getElementById("otp").value.trim();

  const res = await fetch(`${API}/auth/verify-otp`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, code })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.clear();
    localStorage.setItem("token", data.token);
    localStorage.setItem("user", JSON.stringify(data.user));

    window.location.replace("dashboard.html");
  } else {
    document.getElementById("msg2").innerText = data.error;
  }
}
</script>

</body>
</html>
