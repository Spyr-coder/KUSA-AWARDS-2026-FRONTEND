<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KUSA Awards 2026 - Nominate</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<h2>KUSA Awards 2026 - Nominate a Candidate</h2>

<button onclick="goBack()">⬅ Back</button>

<script>
const token = localStorage.getItem("token");

if (!token) {
  alert("Please log in first.");
  window.location.href = "login.html";
}
</script>

<!-- =========================
     NOMINATION FORM
========================= -->
<div class="card">
  <h3>Submit Nomination</h3>

  <input type="text" id="name" placeholder="Nominee Full Name">
  <input type="text" id="contact" placeholder="Nominee Contact (Phone or Email)">

  <select id="categorySelect">
    <option value="">Select Category</option>
  </select>

  <textarea id="reason" placeholder="Why are you nominating this person? (optional)"></textarea>

  <button onclick="submitNomination()">Submit Nomination</button>

  <p id="msg"></p>
</div>

<!-- =========================
     MY NOMINATIONS
========================= -->
<div class="card">
  <h3>My Nominations</h3>
  <div id="myNominations"></div>
</div>

<script>
const API = "http://localhost:5000/api";

/* =========================
   NAVIGATION
========================= */
function goBack() {
  window.location.href = "dashboard.html";
}

/* =========================
   LOAD CATEGORIES
========================= */
async function loadCategories() {
  try {
    const res = await fetch(`${API}/categories/public`, {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    const categories = await res.json();

    const select = document.getElementById("categorySelect");
    select.innerHTML = '<option value="">Select Category</option>';

    if (!Array.isArray(categories)) return;

    categories.forEach(cat => {
      const option = document.createElement("option");
      option.value = cat.id;
      option.textContent = cat.name;
      select.appendChild(option);
    });

  } catch (err) {
    console.error("Failed to load categories:", err);
  }
}

/* =========================
   SUBMIT NOMINATION
========================= */
async function submitNomination() {
  const name = document.getElementById("name").value.trim();
  const contact = document.getElementById("contact").value.trim();
  const categoryId = document.getElementById("categorySelect").value;
  const reason = document.getElementById("reason").value.trim();

  if (!name || !contact || !categoryId) {
    alert("Please fill all required fields");
    return;
  }

  try {
    const res = await fetch(`${API}/nominations`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify({
        nomineeName: name,
        contact,
        categoryId,
        reason
      })
    });

    const data = await res.json();

    if (data.success) {
      document.getElementById("msg").innerText = "Nomination submitted successfully!";

      document.getElementById("name").value = "";
      document.getElementById("contact").value = "";
      document.getElementById("reason").value = "";
      document.getElementById("categorySelect").value = "";

      loadMyNominations();
    } else {
      document.getElementById("msg").innerText = data.error || "Submission failed";
    }

  } catch (err) {
    console.error(err);
    document.getElementById("msg").innerText = "Something went wrong";
  }
}

/* =========================
   MY NOMINATIONS (FIXED)
========================= */
async function loadMyNominations() {
  try {
    const res = await fetch(`${API}/nominations/me`, {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    const data = await res.json();

    const container = document.getElementById("myNominations");
    container.innerHTML = "";

    const nominations = data.nominations || [];

    if (nominations.length === 0) {
      container.innerHTML = "<p>No nominations yet</p>";
      return;
    }

    nominations.forEach(n => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h4>${n.nominee?.name || "No Name"}</h4>
        <p><strong>Category:</strong> ${n.nominee?.category?.name || "N/A"}</p>
        <p><strong>Contact:</strong> ${n.nominee?.contact || "N/A"}</p>
        <p><strong>Reason:</strong> ${n.reason || "No reason provided"}</p>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    document.getElementById("myNominations").innerHTML =
      "<p>Failed to load nominations</p>";
  }
}

/* =========================
   INIT
========================= */
loadCategories();
loadMyNominations();
</script>

</body>
</html>
