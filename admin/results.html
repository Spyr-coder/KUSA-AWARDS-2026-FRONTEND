<!DOCTYPE html>
<html>
<head>
  <title>Results</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="container">

  <h1>Results & Winners</h1>

  <div class="card">
    <h3>Select Category</h3>

    <select id="category" onchange="loadResults()"></select>
  </div>

  <div class="card">
    <h3>Results</h3>

    <table border="1" width="100%">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Nominee</th>
          <th>Votes</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="resultsTable"></tbody>
    </table>
  </div>

  <p id="msg"></p>

  <button onclick="goBack()">Back</button>

</div>

<script src="../js/api.js"></script>
<script src="../js/results.js"></script>

</body>
</html>
